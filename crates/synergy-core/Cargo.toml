[package]
name = "synergy-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
async-trait = "0.1"
anyhow = "1.0"
regex = "1.10"
once_cell = "1.19"
synergy-proto = { path = "../synergy-proto" }
synergy-pty = { path = "../synergy-pty" }
synergy-proxy = { path = "../synergy-proxy" }
synergy-adapter = { path = "../synergy-adapter" }
synergy-db = { path = "../synergy-db" }
synergy-win32 = { path = "../synergy-win32" }

[dev-dependencies]
tempfile = "3.10"
