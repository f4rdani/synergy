function closeAllMenus() {
  document.querySelectorAll('.menu-dropdown').forEach(d => d.classList.remove('show'));
  document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('open'));
}

function handleMenuAction(action) {
  switch(action) {
    case 'open-folder':
    case 'change-project':
      handleMenuOpenFolder();
      break;
    case 'settings':
      openSettings();
      break;
    case 'toggle-sidebar':
      toggleSidebar();
      break;
    case 'toggle-logs':
      APP.showLogPanel = !APP.showLogPanel;
      render();
      if (APP.showLogPanel) {
        setTimeout(() => {
          const body = document.getElementById('log-panel-body');
          if (body) body.scrollTop = body.scrollHeight;
        }, 50);
      }
      break;
    case 'toggle-terminal':
      toggleTerminal();
      break;
    case 'toggle-leader':
      toggleLeaderPanel();
      break;
    case 'new-terminal':
      APP.showTerminal = true;
      if (APP.integratedTerm) { APP.integratedTerm.dispose(); APP.integratedTerm = null; }
      render();
      break;
    case 'clear-terminal':
      if (APP.integratedTerm) APP.integratedTerm.clear();
      break;
    case 'kill-terminal':
      APP.showTerminal = false;
      if (APP.integratedTerm) { APP.integratedTerm.dispose(); APP.integratedTerm = null; }
      render();
      break;
    case 'exit':
      invoke('close_window', {}).catch(()=>{});
      break;
    case 'zoom-in':
      document.body.style.fontSize = (parseInt(getComputedStyle(document.body).fontSize) + 1) + 'px';
      break;
    case 'zoom-out':
      document.body.style.fontSize = (parseInt(getComputedStyle(document.body).fontSize) - 1) + 'px';
      break;
    case 'about':
      alert('Synergy v0.3.0 — Kiro UI\nMulti-App AI Workspace Orchestrator');
      break;
  }
}

async function handleMenuOpenFolder() {
  const folder = await openFolderDialog();
  if (folder) {
    APP.projectDir = folder;
    try { await invoke('select_folder', { path: folder }); } catch (e) {}
    try { await invoke('add_recent_project', { path: folder }); } catch (e) {}
    await loadAdaptersAndGo();
  }
}

function toggleTerminal() {
  if (APP.integratedTerm) { APP.integratedTerm.dispose(); APP.integratedTerm = null; }
  APP.showTerminal = !APP.showTerminal;
  render();
}

function toggleSidebar() {
  const sidebar = document.querySelector('.sidebar');
  if (sidebar) sidebar.classList.toggle('hidden');
}

function toggleLeaderPanel() {
  const panel = document.querySelector('.leader-panel');
  if (panel) panel.classList.toggle('hidden');
}

function initIntegratedTerminal() {
  const container = document.getElementById('integrated-terminal');
  if (!container || APP.integratedTerm) return;
  if (typeof Terminal === 'undefined') return;
  const term = new Terminal({
    theme: { background: '#11111b', foreground: '#cdd6f4', cursor: '#89b4fa' },
    fontFamily: "'JetBrains Mono', monospace",
    fontSize: 12,
    cursorBlink: true,
  });
  term.open(container);
  if (typeof FitAddon !== 'undefined') {
    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    setTimeout(() => { try { fitAddon.fit(); } catch(e) {} }, 50);
    new ResizeObserver(() => { try { fitAddon.fit(); } catch(e) {} }).observe(container);
  }
  term.writeln('\x1b[38;2;137;180;250mSynergy Terminal\x1b[0m');
  term.writeln('Type commands here (connected to system shell when available)');
  term.writeln('');
  term.write('\x1b[38;2;166;227;161m$\x1b[0m ');
  APP.integratedTerm = term;
}

// --- Executing screen init ---
function initExecutingScreen() {
  requestAnimationFrame(() => {
    for (let i = 0; i < APP.workerCount; i++) {
      initTerminal(i);
    }
    const isCli = APP.selectedAdapter && APP.selectedAdapter.type === 'cli';
    if (isCli) {
      initLeaderTerminal();
    }
  });
  startPolling();
}

function initLeaderTerminal() {
  const container = document.getElementById('leader-term') || document.getElementById('leader-term-container');
  if (!container || APP.leaderTerm) return;
  const term = new Terminal({
    fontFamily: '"JetBrains Mono", monospace',
    fontSize: 12,
    lineHeight: 1.3,
    convertEol: true,
    cursorBlink: true,
    scrollback: 5000,
    theme: {
      background: '#11111b',
      foreground: '#cdd6f4',
      cursor: '#89b4fa',
      selectionBackground: 'rgba(137,180,250,.25)',
      black: '#45475a', red: '#f38ba8', green: '#a6e3a1', yellow: '#f9e2af',
      blue: '#89b4fa', magenta: '#f5c2e7', cyan: '#94e2d5', white: '#bac2de',
      brightBlack: '#585b70', brightRed: '#f38ba8', brightGreen: '#a6e3a1',
      brightYellow: '#f9e2af', brightBlue: '#89b4fa', brightMagenta: '#f5c2e7',
      brightCyan: '#94e2d5', brightWhite: '#a6adc8'
    }
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(container);
  try { fit.fit(); } catch (e) {}

  // Send keystrokes to PTY
  term.onData(data => {
    invoke('send_raw_to_leader', { data: data }).catch(()=>{});
  });

  APP.leaderTerm = { term, fit };
  new ResizeObserver(() => { try { fit.fit(); } catch (e) {} }).observe(container);

  term.writeln('\x1b[2m# Leader connected. Type your request below or press Enter to interact.\x1b[0m');
}

function initTerminal(id) {
  const host = document.getElementById('worker-term-' + id);
  if (!host || APP.terminals.has(id)) return;
  const term = new Terminal({
    fontFamily: '"JetBrains Mono", monospace',
    fontSize: 11,
    lineHeight: 1.2,
    convertEol: true,
    scrollback: 3000,
    theme: { background: '#11111b', foreground: '#cdd6f4', cursor: '#89b4fa', selectionBackground: 'rgba(137,180,250,.25)' }
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(host);
  try { fit.fit(); } catch (e) {}
  APP.terminals.set(id, { term, fit });
  new ResizeObserver(() => { try { fit.fit(); } catch (e) {} }).observe(host);
  term.writeln('\x1b[2m# Worker ' + (id + 1) + ' ready\x1b[0m');
}

function disposeTerminals() {
  APP.terminals.forEach(({ term }) => { try { term.dispose(); } catch (e) {} });
  APP.terminals.clear();
}

async function subscribeEvents() {
  appendSystemLog('info', 'boot', 'Subscribing to Tauri events...');

  await listen('leader-connection-status', ev => {
    const data = ev.payload || ev;
    appendSystemLog('info', 'event', `leader-connection-status: ${data.status} — ${data.message || ''}`);

    APP.connectionStatus = data.status; // 'connecting', 'connected', 'failed'
    APP.connectionMessage = data.message || '';
    APP.connectionType = data.connection_type || '';

    // Add to connection log
    if (!APP.connectionLog) APP.connectionLog = [];
    APP.connectionLog.push({ ts: new Date().toLocaleTimeString(), ...data });

    render();
  });

  await listen('worker-output', ev => {
    const p = ev.payload || ev;
    const entry = APP.terminals.get(p.worker_id);
    if (entry) entry.term.write(p.chunk);
  });

  // Listen for backend system logs
  await listen('synergy-log', ev => {
    const p = ev.payload || ev;
    appendSystemLog(p.level, p.source, p.message);
  });

  await listen('leader-output', ev => {
    const p = ev.payload || ev;
    const raw = p.chunk || '';
    if (!raw) return;

    // Markers (handled before ANSI strip — they're plain ASCII)
    const BUSY = '\u200B__SYNERGY_BUSY__\u200B';
    const IDLE = '\u200B__SYNERGY_IDLE__\u200B';
    const NEW_TURN = '\u200B__SYNERGY_NEW_TURN__\u200B';

    // Marker-only chunks: update status without touching chat
    if (raw.includes(BUSY)) {
      APP.leaderBusy = true;
      updateStatusBadge();
    }
    if (raw.includes(IDLE)) {
      APP.leaderBusy = false;
      APP.leaderTurnCount = (APP.leaderTurnCount || 0) + 1;
      updateStatusBadge();
      // After Leader settles, refresh changelog if we're past the briefing.
      if (APP.leaderTurnCount > 1) refreshChangelog();
    }

    // For workspace screen: append to chat messages (headless run mode)
    if (APP.screen === 'workspace') {
      // Strip ANSI for chat display
      let text = raw.replace(/\x1b\[[0-9;?]*[a-zA-Z]/g, '')
                    .replace(/\x1b\][^\x07]*\x07/g, '')
                    .replace(/[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]/g, '');
      // Strip our markers from the visible chat text.
      text = text.split(BUSY).join('').split(IDLE).join('');
      if (!text || !text.trim()) return;

      appendSystemLog('debug', 'leader-output', `Received ${text.length} chars: "${text.slice(0, 80)}..."`);

      // Remove "thinking" indicator
      APP.leaderMessages = APP.leaderMessages.filter(m => m.content !== '⏳ Thinking...');

      // Detect new turn marker
      if (text.includes(NEW_TURN)) {
        const clean = text.replace(NEW_TURN, '').trim();
        if (clean) APP.leaderMessages.push({ role: 'assistant', content: clean });
        appendSystemLog('info', 'leader-output', 'New turn marker detected — new response bubble');
        updateLeaderChatUI();
        return;
      }

      // Accumulate into last assistant message
      const lastMsg = APP.leaderMessages[APP.leaderMessages.length - 1];
      if (lastMsg && lastMsg.role === 'assistant' && !lastMsg.completed) {
        lastMsg.content += text;
      } else {
        APP.leaderMessages.push({ role: 'assistant', content: text });
      }

      // Plan detection
      APP.leaderRawBuffer = (APP.leaderRawBuffer || '') + text;
      if (APP.leaderRawBuffer.length > 100000) APP.leaderRawBuffer = APP.leaderRawBuffer.slice(-50000);
      detectLeaderPlan();

      updateLeaderChatUI();
      return;
    }

    // Legacy: chat-style stripping for older screens
    let text = raw.replace(/\x1b\[[0-9;?]*[a-zA-Z]/g, '')
                  .replace(/\x1b\][^\x07]*\x07/g, '')
                  .replace(/\x1b[()][AB012]/g, '')
                  .replace(/[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]/g, '');
    text = text.split(BUSY).join('').split(IDLE).join('').split(NEW_TURN).join('');
    APP.leaderRawBuffer = (APP.leaderRawBuffer || '') + text;
    if (APP.leaderRawBuffer.length > 50000) {
      APP.leaderRawBuffer = APP.leaderRawBuffer.slice(-30000);
    }
  });

  await listen('session-state-changed', ev => {
    const p = ev.payload || ev;
    if (p.phase === 'reviewing') {
      APP.leaderMessages.push({ role: 'system', content: 'All tasks complete. Leader is reviewing the results...' });
      if (APP.screen === 'executing') updateLeaderChat();
    } else if (p.phase === 'complete') {
      if (APP.pollInterval) { clearInterval(APP.pollInterval); APP.pollInterval = null; }
      setTimeout(() => goTo('complete'), 1000);
    }
  });
}

function detectPlan(messagesArray) {
  // Look for numbered list in the last assistant message
  const assistantMsgs = (messagesArray || APP.messages).filter(m => m.role === 'assistant');
  if (assistantMsgs.length === 0) return;
  const lastAssistant = assistantMsgs[assistantMsgs.length - 1];
  const lines = lastAssistant.content.split('\n');
  const numbered = lines.map(l => l.match(/^\s*(\d+)[.)]\s+(.+)$/)).filter(Boolean);
  if (numbered.length >= 2) {
    const newTasks = numbered.map(m => m[2]);
    if (!APP.planTasks || APP.planTasks.length !== newTasks.length) {
      APP.planText = lastAssistant.content;
      APP.planTasks = newTasks;
      if (APP.screen === 'executing') render();
    }
  }
}

function detectPlanFromBuffer() {
  if (!APP.leaderRawBuffer) return;
  // Look at the last 5KB of buffer for a numbered list
  const tail = APP.leaderRawBuffer.slice(-5000);
  const lines = tail.split('\n');
  const numbered = lines.map(l => l.match(/^\s*(\d+)[.)]\s+(.+)$/)).filter(Boolean);
  if (numbered.length >= 2) {
    const newTasks = numbered.map(m => m[2].trim()).filter(t => t.length > 0 && t.length < 200);
    if (newTasks.length >= 2 && (!APP.planTasks || APP.planTasks.length !== newTasks.length)) {
      APP.planText = tail;
      APP.planTasks = newTasks;
      // Re-render the planning screen to show Execute button
      if (APP.screen === 'planning') {
        // Use partial render to preserve terminal
        render();
      }
    }
  }
}

function startPolling() {
  if (APP.pollInterval) clearInterval(APP.pollInterval);
  APP.pollInterval = setInterval(async () => {
    if (APP.screen !== 'executing') return;
    try {
      const state = await invoke('get_state', { sessionId: APP.sessionId });
      if (state.tasks) APP.execTasks = state.tasks;
      if (state.workers) APP.workers = state.workers;
      updateProgressPanel();
      updateWorkerHeaders();
      checkComplete();
    } catch (e) {}
  }, 1000);
}

function checkComplete() {
  if (APP.execTasks.length > 0 && APP.execTasks.every(t => t.status === 'done' || t.status === 'error')) {
    if (APP.pollInterval) { clearInterval(APP.pollInterval); APP.pollInterval = null; }
    setTimeout(() => goTo('complete'), 1500);
  }
}

// --- Partial DOM updates for executing screen ---
function updateProgressPanel() {
  const sidebar = document.querySelector('.sidebar');
  if (!sidebar) return;
  // Keep the sidebar header, replace the rest
  const header = sidebar.querySelector('.sidebar-header');
  if (header) {
    sidebar.innerHTML = '<div class="sidebar-header">EXPLORER</div>' + renderSidebar();
  }
}

function updateWorkerHeaders() {
  // Update status dots/badges without rebuilding terminals
  for (let i = 0; i < APP.workerCount; i++) {
    const w = APP.workers[i];
    if (!w) continue;
    const dot = document.querySelector(`#workers-grid .worker-cell:nth-child(${i+1}) .worker-dot`);
    if (dot) {
      dot.className = 'worker-dot ' + (w.status === 'working' ? 'blue' : w.status === 'done' ? 'green' : 'gray');
    }
    // Update editor tab dots
    const tab = document.querySelector(`.editor-tab[data-worker-tab="${i}"] .editor-tab-dot`);
    if (tab) {
      tab.className = 'editor-tab-dot ' + (w.status === 'working' ? 'etd-working' : w.status === 'done' ? 'etd-done' : 'etd-idle');
    }
  }
}

function updateLeaderChat() {
  const area = document.getElementById('leader-chat-area');
  if (!area) return;
  area.innerHTML = APP.leaderMessages.map(m => `<div class="chat-msg ${m.role}">${escapeHtml(m.content)}</div>`).join('');
  area.scrollTop = area.scrollHeight;
}

// --- Utility ---
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function formatElapsed(ms) {
  const secs = Math.floor(ms / 1000);
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  return m + ':' + String(s).padStart(2, '0');
}

// --- Settings Modal ---
function renderSettingsModal() {
  if (!APP.showSettings) return '';
  const currentModel = APP.workerModel || 'anthropic/claude-sonnet-4-20250514';
  const models = APP.availableModels || [];
  const modelOptions = models.map(m =>
    `<option value="${m.id}" ${m.id === currentModel ? 'selected' : ''}>${m.name} (${m.provider})${m.free ? ' - Free' : ''}</option>`
  ).join('');

  return `<div class="settings-overlay" id="settings-overlay">
    <div class="settings-modal">
      <div class="settings-header">
        <span class="settings-title">Settings</span>
        <button class="settings-close" id="btn-settings-close">&times;</button>
      </div>
      <div class="settings-body">
        <div class="settings-section">
          <div class="settings-section-title">Worker Configuration</div>
          <div class="settings-field">
            <label class="settings-label">AI Model</label>
            <select class="settings-select" id="select-worker-model">${modelOptions}</select>
            <div class="settings-hint">Model used by all OpenCode workers. Uses /model command in OpenCode.</div>
          </div>
          <div class="settings-field">
            <label class="settings-label">Max Workers</label>
            <select class="settings-select" id="select-worker-count">
              ${[1,2,3,4,5,6].map(n => `<option value="${n}" ${n === APP.workerCount ? 'selected' : ''}>${n}</option>`).join('')}
            </select>
            <div class="settings-hint">Maximum number of parallel workers (1-6). Actual count depends on task parallelism.</div>
          </div>
        </div>
      </div>
      <div class="settings-footer">
        <button class="btn-primary" id="btn-settings-save">Save</button>
      </div>
    </div>
  </div>`;
}

async function openSettings() {
  try {
    APP.availableModels = await invoke('get_available_models');
    APP.workerModel = await invoke('get_worker_model');
  } catch(e) {
    showError('Failed to load settings: ' + e);
    APP.availableModels = [];
  }
  APP.showSettings = true;
  render();
}

async function saveSettings() {
  const modelSelect = document.getElementById('select-worker-model');
  const countSelect = document.getElementById('select-worker-count');
  if (modelSelect) {
    APP.workerModel = modelSelect.value;
    try { await invoke('set_worker_model_cmd', { model: modelSelect.value }); } catch(e) {}
  }
  if (countSelect) {
    APP.workerCount = parseInt(countSelect.value);
  }
  APP.showSettings = false;
  render();
}

// --- Model Selector ---
function renderModelSelector() {
  if (!APP.showModelSelector) return '';

  let content;
  if (APP.modelLoading) {
    content = `<div class="model-loading"><div class="model-loading-spinner"></div><span>Querying OpenCode for available models...</span></div>`;
  } else {
    const items = APP.availableModels.map(m => `
      <div class="model-option${m.id === APP.workerModel ? ' selected' : ''}${!m.free ? ' disabled' : ''}" data-model-id="${m.id}">
        <div class="model-option-header">
          <span class="model-option-name">${escapeHtml(m.name)}</span>
          <span class="model-option-provider">${escapeHtml(m.provider)}</span>
        </div>
        <div class="model-option-id">${escapeHtml(m.id)}</div>
        ${m.free ? '<span class="model-free-badge">FREE</span>' : ''}
      </div>
    `).join('');
    content = `<div class="model-list">${items}</div>`;
  }

  return `<div class="settings-overlay" id="model-selector-overlay">
    <div class="model-selector-modal">
      <div class="settings-header">
        <span class="settings-title">Select Worker Model</span>
        <span style="font-size:10px;color:var(--text-dim);margin-left:8px">Models queried from OpenCode (/model)</span>
        <button class="settings-close" id="btn-model-close">&times;</button>
      </div>
      <div class="model-selector-body">
        ${content}
      </div>
      <div class="model-selector-footer">
        <span class="model-current">Current: <strong>${APP.workerModel || 'none'}</strong></span>
        <button class="btn-secondary" id="btn-model-refresh">Refresh List</button>
      </div>
    </div>
  </div>`;
}

async function openModelSelector() {
  APP.showModelSelector = true;
  APP.modelLoading = true;
  APP.availableModels = [];
  render();

  try {
    const models = await invoke('get_available_models');
    APP.availableModels = models;
    APP.modelLoading = false;
  } catch(e) {
    APP.availableModels = [];
    APP.modelLoading = false;
    showError('Failed to query models: ' + e);
  }
  render();
}

async function selectModel(modelId) {
  if (!modelId) return;
  APP.workerModel = modelId;
  APP.showModelSelector = false;
  try {
    await invoke('set_worker_model_cmd', { model: modelId });
  } catch(e) {
    showError('Failed to set model: ' + e);
  }
  render();
}

// --- Keyboard Shortcuts ---
document.addEventListener('keydown', (e) => {
  // Escape closes settings modal or model selector
  if (e.key === 'Escape' && APP.showSettings) {
    APP.showSettings = false;
    render();
    return;
  }
  if (e.key === 'Escape' && APP.showModelSelector) {
    APP.showModelSelector = false;
    render();
    return;
  }

  // Don't trigger shortcuts when focused on input/textarea
  const tag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

  // Ctrl+, open settings
  if (e.ctrlKey && e.key === ',') {
    e.preventDefault();
    openSettings();
  }
  // Ctrl+` toggle terminal
  if (e.ctrlKey && e.key === '`') {
    e.preventDefault();
    toggleTerminal();
  }
  // Ctrl+B toggle sidebar
  if (e.ctrlKey && e.key === 'b') {
    e.preventDefault();
    toggleSidebar();
  }
  // Ctrl+L toggle leader panel
  if (e.ctrlKey && e.key === 'l') {
    e.preventDefault();
    toggleLeaderPanel();
  }
});

// --- Boot ---
(async function init() {
  // Set initial screen to startup (update check)
  APP.screen = 'startup';
  APP.startupStatus = 'Initializing...';

  try {
    APP.recentProjects = await invoke('get_recent_projects');
  } catch(e) {
    console.warn('Could not load recent projects:', e);
    APP.recentProjects = [];
  }

  render();
  await subscribeEvents();

  // Wire skip button
  document.getElementById('btn-skip-update')?.addEventListener('click', () => {
    APP.skipUpdateCheck = true;
  });

  // Run update check with timeout — proceed to welcome regardless
  await checkUpdateAtStartup();

  goTo('welcome');
})();

async function checkUpdateAtStartup() {
  APP.startupStatus = 'Checking for OpenCode updates...';
  APP.startupDetail = '';

  // Update status partially without full re-render
  const updateUI = () => {
    const statusEl = document.querySelector('.startup-screen .loading-status');
    const detailEl = document.querySelector('.startup-screen .loading-detail');
    if (statusEl) statusEl.textContent = APP.startupStatus;
    if (detailEl && APP.startupDetail) detailEl.textContent = APP.startupDetail;
  };
  updateUI();

  // Race: update check vs 5-second timeout vs user skip
  const checkPromise = invoke('check_opencode_update', {});
  const timeoutPromise = new Promise(resolve => setTimeout(() => resolve('__timeout__'), 5000));
  const skipPromise = new Promise(resolve => {
    const interval = setInterval(() => {
      if (APP.skipUpdateCheck) {
        clearInterval(interval);
        resolve('__skipped__');
      }
    }, 100);
  });

  let result;
  try {
    result = await Promise.race([checkPromise, timeoutPromise, skipPromise]);
  } catch (e) {
    result = '__error__:' + e;
  }

  if (result === '__timeout__') {
    APP.startupStatus = 'Update check taking too long...';
    APP.startupDetail = 'Continuing without update. Background install will retry next start.';
    updateUI();
    // Trigger background install (fire & forget)
    invoke('check_opencode_update', {}).catch(() => {});
    await new Promise(r => setTimeout(r, 800));
  } else if (result === '__skipped__') {
    APP.startupStatus = 'Update check skipped';
    APP.startupDetail = 'Will retry on next start';
    updateUI();
    invoke('check_opencode_update', {}).catch(() => {});
    await new Promise(r => setTimeout(r, 400));
  } else if (typeof result === 'string' && result.startsWith('__error__')) {
    APP.startupStatus = 'Update check failed (continuing)';
    updateUI();
    await new Promise(r => setTimeout(r, 600));
  } else {
    APP.startupStatus = 'OpenCode is ready';
    APP.startupDetail = result || 'Up to date';
    updateUI();
    await new Promise(r => setTimeout(r, 500));
  }
}
