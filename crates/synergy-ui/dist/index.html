<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>Synergy v0.8.0 — Plan-only Leader</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#1e1e2e;--bg-surface:#181825;--bg-overlay:#11111b;--bg-mantle:#181825;
--bg-crust:#11111b;--border:#313244;--border-active:#89b4fa;
--text:#cdd6f4;--text-sub:#a6adc8;--text-dim:#585b70;
--accent:#89b4fa;--green:#a6e3a1;--yellow:#f9e2af;--red:#f38ba8;
--mauve:#cba6f7;--peach:#fab387;--teal:#94e2d5;
--surface0:#313244;--surface1:#45475a;--surface2:#585b70;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:13px;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh}
.hidden{display:none!important}

/* Menu Bar */
.menubar{display:flex;align-items:center;height:30px;padding:0;background:var(--bg-crust);border-bottom:1px solid var(--border);-webkit-app-region:drag;user-select:none;font-size:12px}
.menubar-icon{display:flex;align-items:center;justify-content:center;width:46px;height:100%;-webkit-app-region:no-drag}
.menubar-icon svg{width:16px;height:16px;color:var(--accent)}
.menu-items{display:flex;align-items:center;height:100%;-webkit-app-region:no-drag}
.menu-item{padding:0 8px;height:100%;display:flex;align-items:center;color:var(--text-sub);cursor:pointer;position:relative}
.menu-item:hover{background:rgba(255,255,255,0.05);color:var(--text)}
.menu-item.open{background:var(--surface0);color:var(--text)}
.menu-dropdown{display:none;position:absolute;top:100%;left:0;min-width:200px;background:var(--bg-surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,0.4);padding:4px 0;z-index:1000}
.menu-dropdown.show{display:block}
.menu-dropdown-item{display:flex;align-items:center;justify-content:space-between;padding:6px 24px 6px 12px;font-size:12px;color:var(--text);cursor:pointer}
.menu-dropdown-item:hover{background:var(--accent);color:var(--bg-crust)}
.menu-dropdown-item .shortcut{color:var(--text-dim);font-size:11px}
.menu-dropdown-item:hover .shortcut{color:var(--bg-crust)}
.menu-separator{height:1px;background:var(--border);margin:4px 8px}
.menubar-spacer{flex:1}
.window-controls{display:flex;align-items:center;height:100%;-webkit-app-region:no-drag}
.win-btn{display:flex;align-items:center;justify-content:center;width:46px;height:100%;color:var(--text-sub);cursor:pointer}
.win-btn:hover{background:rgba(255,255,255,0.07)}
.win-btn.close:hover{background:var(--red);color:#fff}
.win-btn svg{width:14px;height:14px}

/* Bottom Terminal Panel */
.bottom-panel{display:flex;flex-direction:column;background:var(--bg-overlay);border-top:1px solid var(--border);overflow:hidden;transition:height 0.2s}
.bottom-panel.hidden{display:none}
.bottom-panel-header{display:flex;align-items:center;height:35px;padding:0 12px;background:var(--bg-surface);border-bottom:1px solid var(--border);font-size:11px}
.bottom-panel-tabs{display:flex;align-items:center;gap:0;height:100%}
.bottom-panel-tab{display:flex;align-items:center;gap:6px;padding:0 12px;height:100%;color:var(--text-dim);cursor:pointer;border-right:1px solid var(--border);font-size:11px}
.bottom-panel-tab.active{color:var(--text);background:var(--bg-overlay)}
.bottom-panel-tab:hover{color:var(--text-sub)}
.bottom-panel-actions{margin-left:auto;display:flex;align-items:center;gap:4px}
.bottom-panel-btn{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:4px;color:var(--text-dim);cursor:pointer}
.bottom-panel-btn:hover{background:rgba(255,255,255,0.05);color:var(--text)}
.bottom-panel-content{flex:1;min-height:0;background:var(--bg-overlay)}
.terminal-instance{width:100%;height:100%}

/* Screens */
.screen{display:none;flex:1;min-height:0}
.screen.active{display:flex}

/* Welcome */
.welcome-screen{align-items:center;justify-content:center;flex-direction:column;gap:20px}
.welcome-logo svg{width:64px;height:64px;color:var(--accent)}
.welcome-title{font-size:28px;font-weight:700;color:var(--text);letter-spacing:-0.5px}
.welcome-subtitle{font-size:14px;color:var(--text-sub);margin-top:4px}
.welcome-version{font-size:11px;color:var(--text-dim);margin-top:2px}
.welcome-actions{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:16px}
.btn-primary{background:var(--accent);color:var(--bg-crust);border:none;border-radius:8px;padding:12px 32px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s}
.btn-primary:hover{opacity:.85}
.btn-secondary{background:var(--surface0);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 24px;font-size:13px;cursor:pointer;transition:all .15s}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
.folder-input-row{display:flex;gap:8px;align-items:center;margin-top:8px}
.folder-input{background:var(--bg-overlay);border:1px solid var(--border);border-radius:6px;padding:10px 14px;color:var(--text);font-size:12px;width:320px;outline:none;font-family:'JetBrains Mono',monospace}
.folder-input:focus{border-color:var(--accent)}
.folder-input-btn{background:var(--surface0);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:10px 14px;font-size:12px;cursor:pointer}
.folder-input-btn:hover{border-color:var(--accent)}

/* Recent Projects */
.recent-projects{margin-top:24px;width:360px}
.recent-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim);margin-bottom:8px}
.recent-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;cursor:pointer;transition:all .12s;font-size:12px;color:var(--text)}
.recent-item:hover{background:var(--surface0)}
.recent-path{font-size:10px;color:var(--text-dim);margin-left:auto;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl}

/* Leader Select */
.leader-select-screen{flex-direction:column;padding:32px;gap:16px;overflow-y:auto}
.screen-title{font-size:20px;font-weight:700;color:var(--text)}
.screen-subtitle{font-size:13px;color:var(--text-sub);margin-top:4px}
.adapters-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:12px}
.adapter-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:all .15s}
.adapter-card:hover{border-color:var(--accent);background:var(--bg-overlay)}
.adapter-card.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(137,180,250,.2)}
.adapter-card-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.adapter-card-id{font-size:14px;font-weight:600;color:var(--text)}
.adapter-type-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.5px}
.badge-cli{background:rgba(166,227,161,.12);color:var(--green)}
.badge-gui{background:rgba(203,166,247,.12);color:var(--mauve)}
.adapter-card-desc{font-size:12px;color:var(--text-sub);line-height:1.4}
.adapter-conn-info{font-size:10px;color:var(--teal);margin-top:6px;display:flex;align-items:center;gap:4px}
.conn-icon{font-family:'JetBrains Mono',monospace;font-size:11px}

/* Planning Chat - Kiro-style */
.planning-screen{flex-direction:column;background:var(--bg)}
.planning-topbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--bg-surface);border-bottom:1px solid var(--border);min-height:44px}
.planning-topbar .leader-badge{display:flex;align-items:center;gap:8px}
.planning-topbar .leader-avatar{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--mauve));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px;flex-shrink:0}
.planning-topbar .leader-meta{display:flex;flex-direction:column;line-height:1.2}
.planning-topbar .leader-meta-name{font-size:12px;font-weight:600;color:var(--text)}
.planning-topbar .leader-meta-status{font-size:10px;color:var(--green);display:flex;align-items:center;gap:4px}
.planning-topbar .leader-meta-status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 4px var(--green)}
.planning-topbar-spacer{flex:1}
.planning-topbar-action{display:flex;align-items:center;gap:5px;background:var(--surface0);border:1px solid var(--border);border-radius:6px;padding:5px 10px;color:var(--text);font-size:11px;cursor:pointer;transition:all .15s}
.planning-topbar-action:hover{border-color:var(--accent);color:var(--accent)}
.planning-topbar-action svg{width:13px;height:13px}
.planning-topbar-action.model-pill{color:var(--teal);font-family:'JetBrains Mono',monospace}
.planning-topbar-action.model-pill:hover{border-color:var(--teal);color:var(--teal)}

.planning-body{flex:1;display:flex;min-height:0}
.planning-terminal-wrap{flex:1;background:var(--bg-overlay);min-width:0;display:flex;flex-direction:column}
.planning-terminal{flex:1;min-height:0;padding:8px;background:#11111b}

.planning-context-panel{width:240px;border-left:1px solid var(--border);background:var(--bg-surface);display:flex;flex-direction:column;overflow-y:auto}
.context-section{padding:10px 12px;border-bottom:1px solid var(--border)}
.context-section-title{font-size:10px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.context-item{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:4px;font-size:11px;color:var(--text-sub);cursor:default}
.context-item:hover{background:rgba(255,255,255,0.04)}
.context-item-icon{flex-shrink:0;width:14px;text-align:center}
.context-add-btn{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;padding:5px;background:transparent;border:1px dashed var(--border);border-radius:4px;color:var(--text-dim);font-size:11px;cursor:pointer;margin-top:4px}
.context-add-btn:hover{border-color:var(--accent);color:var(--accent)}

.planning-actions-row{display:flex;gap:8px;padding:10px 14px;background:var(--bg-surface);border-top:1px solid var(--border)}
.planning-action-btn{flex:1;background:var(--surface0);border:1px solid var(--border);border-radius:6px;padding:8px 12px;color:var(--text);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.planning-action-btn:hover{border-color:var(--accent);background:var(--bg-overlay)}
.planning-action-btn.primary{background:var(--accent);color:var(--bg-crust);border-color:var(--accent);font-weight:600}
.planning-action-btn.primary:hover{opacity:.9;background:var(--accent)}

.planning-input-area{padding:10px 14px;background:var(--bg-surface);border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end}
.planning-input-area textarea{flex:1;background:var(--bg-overlay);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-family:inherit;font-size:13px;resize:none;outline:none;min-height:42px;max-height:120px;line-height:1.4}
.planning-input-area textarea:focus{border-color:var(--accent)}
.planning-input-area .send-btn{align-self:flex-end;background:var(--accent);border:none;border-radius:8px;padding:10px 18px;color:var(--bg-crust);font-weight:600;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:5px}
.planning-input-area .send-btn:hover{opacity:.9}
.planning-input-area .send-btn:disabled{opacity:.4;cursor:not-allowed}
.planning-header{padding:12px 16px;border-bottom:1px solid var(--border);background:var(--bg-surface)}
.planning-conn-status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text)}
.planning-conn-status strong{color:var(--accent)}
.conn-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.conn-dot.connected{background:var(--green);box-shadow:0 0 6px var(--green)}
.conn-dot.disconnected{background:var(--red)}
.conn-dot.connecting{background:var(--yellow);box-shadow:0 0 6px var(--yellow);animation:pulse 1s ease infinite}
.conn-log{margin-top:8px;max-height:80px;overflow-y:auto;border-top:1px solid var(--border);padding-top:6px}
.conn-log-entry{display:flex;align-items:center;gap:6px;padding:2px 0;font-size:10px;font-family:'JetBrains Mono',monospace}
.conn-log-time{color:var(--text-dim);min-width:60px}
.conn-log-status{font-weight:600;min-width:70px}
.conn-connecting{color:var(--yellow)}
.conn-connected{color:var(--green)}
.conn-failed{color:var(--red)}
.conn-log-msg{color:var(--text-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conn-type-badge{font-size:9px;background:var(--surface0);color:var(--text-dim);padding:2px 6px;border-radius:4px;margin-left:8px}
.btn-fetch-models{margin-left:auto;background:var(--surface0);border:1px solid var(--border);border-radius:5px;padding:3px 10px;color:var(--mauve);font-size:10px;cursor:pointer}
.btn-fetch-models:hover{border-color:var(--mauve)}
.planning-hint{font-size:11px;color:var(--text-dim);margin-top:4px}
.chat-area{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.chat-msg{max-width:80%;padding:12px 16px;border-radius:12px;font-size:13px;line-height:1.6;word-break:break-word;white-space:pre-wrap}
.chat-msg.user{align-self:flex-end;background:var(--accent);color:var(--bg-crust);border-bottom-right-radius:3px}
.chat-msg.assistant{align-self:flex-start;background:var(--surface0);color:var(--text);border-bottom-left-radius:3px}
.chat-msg.system{align-self:center;background:transparent;color:var(--text-dim);font-size:11px;font-style:italic;text-align:center}
.chat-input-area{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:10px;background:var(--bg-surface)}
.chat-input-area textarea{flex:1;background:var(--bg-overlay);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-family:inherit;font-size:13px;resize:none;outline:none;min-height:44px;max-height:140px}
.chat-input-area textarea:focus{border-color:var(--accent)}
.chat-send-btn{align-self:flex-end;background:var(--accent);border:none;border-radius:8px;padding:10px 18px;color:var(--bg-crust);font-weight:600;font-size:13px;cursor:pointer}
.chat-send-btn:hover{opacity:.85}
.btn-review-plan{background:var(--green);color:var(--bg-crust);border:none;border-radius:8px;padding:10px 20px;font-weight:600;font-size:13px;cursor:pointer;margin:0 auto 8px}
.btn-review-plan:hover{opacity:.85}

/* Plan Review */
.plan-review-screen{flex-direction:column;padding:32px;gap:16px;overflow-y:auto}
.plan-tasks-list{list-style:none;display:flex;flex-direction:column;gap:8px;margin:12px 0}
.plan-task-item{display:flex;align-items:flex-start;gap:10px;padding:12px 16px;background:var(--bg-surface);border:1px solid var(--border);border-radius:8px;font-size:13px}
.plan-task-item .task-num{font-weight:700;color:var(--accent);min-width:24px}
.plan-task-item .task-text{color:var(--text)}
.plan-actions{display:flex;gap:12px;margin-top:8px}

/* Executing - VS Code-like layout */
.executing-screen{flex-direction:row;background:var(--bg)}

/* Activity Bar (far left, 48px) */
.activity-bar{width:48px;min-width:48px;background:var(--bg-crust);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding-top:8px;gap:4px}
.activity-icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;color:var(--text-dim);transition:all .15s;position:relative}
.activity-icon:hover{color:var(--text-sub);background:rgba(255,255,255,.04)}
.activity-icon.active{color:var(--text)}
.activity-icon.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:0 2px 2px 0;background:var(--accent)}
.activity-icon svg{width:20px;height:20px}
.activity-spacer{flex:1}

/* Sidebar (220px, VS Code explorer) */
.sidebar{width:220px;min-width:180px;background:var(--bg-surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.sidebar-header{padding:10px 14px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--text-sub);border-bottom:1px solid var(--border)}
.sidebar-section{display:flex;flex-direction:column}
.section-title{display:flex;align-items:center;gap:6px;padding:6px 14px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim);cursor:pointer;user-select:none}
.section-title:hover{color:var(--text-sub);background:rgba(255,255,255,.02)}
.section-title::before{content:"";width:0;height:0;border-left:4px solid var(--text-dim);border-top:3px solid transparent;border-bottom:3px solid transparent;transition:transform .15s}
.section-title.expanded::before{transform:rotate(90deg)}
.section-content{padding:2px 0}
.sidebar-task-item{display:flex;align-items:center;gap:6px;padding:3px 14px 3px 24px;font-size:11px;line-height:1.5;cursor:default}
.sidebar-task-item:hover{background:rgba(255,255,255,.03)}
.sidebar-task-icon{flex-shrink:0;width:14px;text-align:center;font-size:10px}
.stask-done .sidebar-task-icon{color:var(--green)}
.stask-running .sidebar-task-icon{color:var(--accent)}
.stask-pending .sidebar-task-icon{color:var(--text-dim)}
.stask-waiting .sidebar-task-icon{color:var(--yellow)}
.stask-waiting .sidebar-task-text{color:var(--yellow);font-style:italic}
.sidebar-task-text{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.stask-done .sidebar-task-text{color:var(--text-dim);text-decoration:line-through}
.sidebar-task-worker{font-size:9px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;flex-shrink:0}
.sidebar-worker-item{display:flex;align-items:center;gap:6px;padding:3px 14px 3px 24px;font-size:11px}
.sidebar-worker-item:hover{background:rgba(255,255,255,.03)}
.sidebar-worker-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sidebar-worker-dot.sw-working{background:var(--accent);box-shadow:0 0 4px var(--accent)}
.sidebar-worker-dot.sw-done{background:var(--green);box-shadow:0 0 4px var(--green)}
.sidebar-worker-dot.sw-idle{background:var(--text-dim)}
.sidebar-worker-name{color:var(--text-sub);font-weight:500}
.sidebar-worker-task{font-size:9px;color:var(--text-dim);margin-left:auto;max-width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-progress{padding:10px 14px;border-top:1px solid var(--border)}
.sidebar-progress-label{display:flex;justify-content:space-between;font-size:10px;color:var(--text-sub);margin-bottom:4px}
.sidebar-progress-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.sidebar-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--teal));border-radius:2px;transition:width .5s}
.sidebar-log-section{padding:6px 0;border-top:1px solid var(--border)}
.sidebar-log-entry{padding:2px 14px 2px 24px;font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--text-dim);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Editor Area (center, flex) */
.editor-area{flex:1;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--border)}
.editor-tabs{display:flex;align-items:center;height:35px;background:var(--bg-crust);border-bottom:1px solid var(--border);overflow-x:auto;overflow-y:hidden}
.editor-tabs::-webkit-scrollbar{height:0}
.editor-tab{display:flex;align-items:center;gap:6px;padding:0 14px;height:100%;font-size:11px;color:var(--text-dim);border-right:1px solid var(--border);cursor:pointer;white-space:nowrap;transition:all .12s;position:relative}
.editor-tab:hover{color:var(--text-sub);background:var(--bg-surface)}
.editor-tab.active{color:var(--text);background:var(--bg)}
.editor-tab.active::after{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:var(--accent)}
.editor-tab-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.editor-tab-dot.etd-working{background:var(--accent);box-shadow:0 0 4px var(--accent);animation:pulse 1.5s ease infinite}
.editor-tab-dot.etd-done{background:var(--green)}
.editor-tab-dot.etd-idle{background:var(--text-dim)}
.editor-tab-label{font-weight:500}
.editor-tab-task{font-size:9px;color:var(--text-dim);max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.workers-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:1px;background:var(--border);overflow:hidden}
.worker-cell{display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.worker-header-row{display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--bg-surface);border-bottom:1px solid var(--border);font-size:10px}

.worker-dot{width:6px;height:6px;border-radius:50%}

.worker-meta-info{display:flex;gap:8px;margin-left:auto;font-size:9px;color:var(--text-dim);font-family:'JetBrains Mono',monospace}

.w-status-badge{font-size:8px;font-weight:600;padding:1px 5px;border-radius:5px;text-transform:uppercase}
.w-badge-working{background:rgba(137,180,250,.12);color:var(--accent)}
.w-badge-done{background:rgba(166,227,161,.12);color:var(--green)}
.w-badge-idle{background:rgba(88,91,112,.15);color:var(--text-dim)}

.worker-term-container{flex:1;min-height:0;background:var(--bg-overlay)}

/* Leader panel right */
.leader-panel{width:320px;min-width:260px;display:flex;flex-direction:column;background:var(--bg-surface)}
.leader-header-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border)}
.leader-icon{width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--mauve));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.leader-info{flex:1}
.leader-name{font-size:12px;font-weight:600;color:var(--text)}
.leader-model-lbl{font-size:10px;color:var(--mauve);font-family:'JetBrains Mono',monospace}
.leader-chat-area{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.leader-chat-input{padding:8px 12px;border-top:1px solid var(--border);display:flex;gap:8px}
.leader-chat-input textarea{flex:1;background:var(--bg-overlay);border:1px solid var(--border);border-radius:6px;padding:8px 10px;color:var(--text);font-family:inherit;font-size:12px;resize:none;outline:none;min-height:36px;max-height:100px}
.leader-chat-input textarea:focus{border-color:var(--accent)}

/* Complete screen */
.complete-screen{align-items:center;justify-content:center;flex-direction:column;gap:20px}

/* Status bar */

/* Scrollbar */

::-webkit-scrollbar-track{background:transparent}

/* Settings Modal */

/* Model Button in Editor Tabs */

/* Model Selector Modal */
.model-selector-modal{background:var(--bg-surface);border:1px solid var(--border);border-radius:12px;width:520px;max-height:70vh;display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(0,0,0,0.5)}

/* Workspace - OpenCode TUI Leader + Worker mini terminals */
.workspace-screen{flex-direction:row;background:var(--bg-overlay)}
.workspace-leader{flex:1;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--border)}
.workspace-leader-header{height:34px;display:flex;align-items:center;padding:0 12px;background:var(--bg-surface);border-bottom:1px solid var(--border);font-size:11px;font-weight:600;color:var(--text-sub);text-transform:uppercase;letter-spacing:.5px;gap:8px}

.ws-status-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;text-transform:none;letter-spacing:0;background:rgba(166,227,161,.15);color:var(--green);border:1px solid rgba(166,227,161,.3);font-family:'JetBrains Mono',monospace}

.ws-changelog{border-top:1px solid var(--border);max-height:240px;overflow-y:auto;background:var(--bg-overlay)}

.workspace-leader-header button{background:var(--surface0);border:1px solid var(--border);border-radius:4px;padding:3px 8px;color:var(--text-sub);font-size:11px;cursor:pointer}

.workspace-workers{width:380px;min-width:320px;display:flex;flex-direction:column;background:var(--bg-surface)}

.workspace-worker-cell{display:flex;flex-direction:column;background:var(--bg);min-height:130px}
.workspace-worker-row{display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--bg-surface);border-bottom:1px solid var(--border);font-size:10px}
.workspace-worker-row .w-num{font-weight:600;color:var(--accent);min-width:28px}
.workspace-worker-row .w-status{padding:1px 5px;border-radius:3px;font-size:9px;font-weight:600;text-transform:uppercase}
.workspace-worker-row .w-status.idle{background:rgba(88,91,112,.2);color:var(--text-dim)}
.workspace-worker-row .w-status.working{background:rgba(137,180,250,.15);color:var(--accent)}
.workspace-worker-row .w-status.done{background:rgba(166,227,161,.15);color:var(--green)}
.workspace-worker-row .w-proxy{margin-left:auto;color:var(--teal);font-family:'JetBrains Mono',monospace;font-size:9px}

/* Loading screen */
.loading-screen, .startup-screen{align-items:center;justify-content:center;flex-direction:column;gap:24px;background:var(--bg)}
.loading-logo{font-size:48px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--mauve),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-2px}
.loading-spinner{width:48px;height:48px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.9s linear infinite}

.loading-progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--mauve));border-radius:2px;animation:loadingPulse 1.4s ease-in-out infinite}
@keyframes loadingPulse{0%{width:0%}50%{width:80%}100%{width:100%}}
.loading-log{margin-top:12px;width:520px;max-height:160px;overflow-y:auto;background:var(--bg-overlay);border:1px solid var(--border);border-radius:6px;padding:10px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-sub);line-height:1.5}

/* Log panel (workspace footer) */
.log-panel{position:fixed;left:0;right:0;bottom:26px;background:var(--bg-overlay);border-top:1px solid var(--border);max-height:240px;display:flex;flex-direction:column;transition:transform .2s;z-index:50}

.log-panel-header{height:28px;display:flex;align-items:center;padding:0 12px;background:var(--bg-surface);border-bottom:1px solid var(--border);font-size:10px;font-weight:600;color:var(--text-sub);text-transform:uppercase;letter-spacing:.5px;cursor:pointer;user-select:none;gap:8px}
.log-panel-header .log-spacer{flex:1}
.log-panel-header .log-count{background:var(--surface0);color:var(--accent);padding:1px 6px;border-radius:3px;font-size:9px}
.log-panel-header .log-toggle{font-size:14px;color:var(--text-dim)}
.log-panel-body{flex:1;overflow-y:auto;padding:6px 12px;font-family:'JetBrains Mono',monospace;font-size:10.5px;line-height:1.5}
.log-line{display:flex;gap:6px;padding:1px 0;border-bottom:1px dotted rgba(255,255,255,0.02)}
.log-ts{color:var(--text-dim);min-width:90px;flex-shrink:0}
.log-level{min-width:55px;flex-shrink:0;font-weight:600}
.log-level-info{color:var(--accent)}
.log-level-debug{color:var(--text-dim)}

.log-level-error{color:var(--red)}
.log-level-ok{color:var(--green)}

.log-msg{color:var(--text);word-break:break-word;flex:1}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<script>
// Synergy UI - Complete SPA with multi-screen session flow
// State machine: welcome -> leader_select -> planning -> plan_review -> executing -> complete

const APP = {
  screen: 'welcome',
  projectDir: null,
  adapters: [],
  selectedAdapter: null,
  sessionId: null,
  messages: [],
  planText: '',
  planTasks: [],
  execTasks: [],
  workers: [],
  workerCount: 6,
  terminals: new Map(),
  logs: [],
  startTime: null,
  pollInterval: null,
  leaderMessages: [],
  showTerminal: false,
  integratedTerm: null,
  showSettings: false,
  showModelSelector: false,
  modelLoading: false,
  workerModel: '',
  availableModels: [],
  recentProjects: [],
  connectionStatus: 'disconnected',
  connectionMessage: '',
  connectionType: '',
  connectionLog: [],
  leaderModels: [],
  selectedLeaderModel: null,
  showProviderList: false,
  // v0.8.0: Leader status + auto-delegate
  leaderBusy: false,        // true while opencode run is in flight
  leaderTurnCount: 0,       // # of completed turns (used to skip briefing greeting)
  autoDelegateTimer: null,  // setTimeout handle for the 5s countdown
  autoDelegateRemaining: 0, // seconds remaining
  lastDelegatedPlanKey: null, // dedupe so we don't loop the auto-delegate
  gitChanges: null,         // { is_repo, summary, files[] }
};

// --- Tauri Bridge ---
// Tauri v2 exposes invoke via window.__TAURI__.core.invoke
// We wait for it to be available with a small retry loop
async function getTauriInvoke() {
  // Try multiple Tauri v2 paths
  if (window.__TAURI__?.core?.invoke) return window.__TAURI__.core.invoke.bind(window.__TAURI__.core);
  if (window.__TAURI_INTERNALS__?.invoke) return window.__TAURI_INTERNALS__.invoke.bind(window.__TAURI_INTERNALS__);
  // Wait up to 2s for Tauri to inject
  for (let i = 0; i < 20; i++) {
    await new Promise(r => setTimeout(r, 100));
    if (window.__TAURI__?.core?.invoke) return window.__TAURI__.core.invoke.bind(window.__TAURI__.core);
    if (window.__TAURI_INTERNALS__?.invoke) return window.__TAURI_INTERNALS__.invoke.bind(window.__TAURI_INTERNALS__);
  }
  return null;
}

async function invoke(cmd, args = {}) {
  const fn = await getTauriInvoke();
  if (!fn) {
    throw new Error(`Tauri backend not available. Cannot invoke '${cmd}'.`);
  }
  try {
    return await fn(cmd, args);
  } catch (e) {
    console.error(`[Synergy] Command '${cmd}' failed:`, e);
    throw e;
  }
}

async function listen(ev, cb) {
  // Wait for Tauri event system to be available (same retry as invoke)
  let listenFn = null;
  for (let i = 0; i < 20; i++) {
    listenFn = window.__TAURI__?.event?.listen
      || window.__TAURI_INTERNALS__?.listen;
    if (listenFn) break;
    await new Promise(r => setTimeout(r, 100));
  }
  if (!listenFn) {
    console.warn(`[Synergy] Cannot listen to '${ev}' - Tauri event system not available`);
    return () => {};
  }
  return listenFn.call(window.__TAURI__?.event || window.__TAURI_INTERNALS__, ev, cb);
}

async function openFolderDialog() {
  try {
    const result = await invoke('open_folder_dialog');
    return result || null;
  } catch (e) {
    showError('Could not open folder dialog: ' + e.message);
    return null;
  }
}

// --- Error Display ---
function showError(msg) {
  // Remove any existing error overlay first
  document.querySelectorAll('.synergy-error-overlay').forEach(el => el.remove());

  const overlay = document.createElement('div');
  overlay.className = 'synergy-error-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:9999;pointer-events:all';

  const card = document.createElement('div');
  card.style.cssText = 'background:var(--bg-surface);border:1px solid var(--red);border-radius:10px;padding:24px;max-width:420px;width:90%;color:var(--text);box-shadow:0 16px 48px rgba(0,0,0,0.5)';
  card.innerHTML = `
    <div style="font-weight:600;color:var(--red);margin-bottom:10px;font-size:14px">Error</div>
    <div style="font-size:12px;color:var(--text-sub);line-height:1.6;word-break:break-word">${msg}</div>
    <button id="synergy-error-close" style="margin-top:16px;background:var(--surface0);border:1px solid var(--border);border-radius:6px;padding:8px 20px;color:var(--text);cursor:pointer;font-size:12px">Close</button>
  `;
  overlay.appendChild(card);
  document.body.appendChild(overlay);

  // Close on button click
  document.getElementById('synergy-error-close').addEventListener('click', () => overlay.remove());
  // Close on overlay background click
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  // Close on Escape key
  const onKey = (e) => { if (e.key === 'Escape') { overlay.remove(); document.removeEventListener('keydown', onKey); } };
  document.addEventListener('keydown', onKey);
}

// --- Screen transitions ---
function goTo(screen) {
  APP.screen = screen;
  render();
  if (screen === 'workspace') {
    requestAnimationFrame(() => {
      initWorkspaceTerminals();
      fetchAllIps();
      refreshChangelog();
      // Refresh changelog every 5s while in workspace
      if (!APP.changelogInterval) {
        APP.changelogInterval = setInterval(() => {
          if (APP.screen === 'workspace') refreshChangelog();
        }, 5000);
      }
    });
  } else if (APP.changelogInterval) {
    clearInterval(APP.changelogInterval);
    APP.changelogInterval = null;
  }
}

function initWorkspaceTerminals() {
  // Init worker mini terminals only (Leader is now chat-based, no xterm)
  for (let i = 0; i < APP.workerCount; i++) {
    const host = document.getElementById('worker-mini-' + i);
    if (!host || APP.terminals.has(i)) continue;
    const term = new Terminal({
      fontFamily: '"JetBrains Mono", monospace',
      fontSize: 9,
      lineHeight: 1.15,
      convertEol: true,
      scrollback: 1500,
      theme: { background: '#0a0a14', foreground: '#a6adc8', cursor: '#89b4fa' }
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(host);
    setTimeout(() => { try { fit.fit(); } catch (e) {} }, 100);
    APP.terminals.set(i, { term, fit });
    new ResizeObserver(() => { try { fit.fit(); } catch (e) {} }).observe(host);
    term.writeln(`\x1b[2m# Worker ${i + 1} idle\x1b[0m`);
  }

  // Wire up Leader chat input
  const input = document.getElementById('leader-input');
  const sendBtn = document.getElementById('btn-leader-send');
  if (input) {
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleLeaderChat(); }
    });
  }
  if (sendBtn) sendBtn.addEventListener('click', handleLeaderChat);

  // Wire up Delegate button
  document.getElementById('btn-ws-delegate')?.addEventListener('click', delegateTasksToWorkers);

  // Wire up Restart button
  document.getElementById('btn-ws-restart')?.addEventListener('click', async () => {
    const btn = document.getElementById('btn-ws-restart');
    if (btn) { btn.disabled = true; btn.textContent = 'Restarting...'; }
    try {
      await invoke('restart_leader', {});
      APP.leaderMessages = [{ role: 'system', content: 'OpenCode restarted. Ready for new messages.' }];
      updateLeaderChatUI();
    } catch (e) {
      showError('Restart failed: ' + e);
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = '↻ Restart'; }
    }
  });

  // Start polling for worker state
  if (!APP.pollInterval) {
    APP.pollInterval = setInterval(async () => {
      if (APP.screen !== 'workspace' || !APP.sessionId) return;
      try {
        const state = await invoke('get_state', { sessionId: APP.sessionId });
        if (state.workers) {
          APP.workers = state.workers;
          state.workers.forEach((w, idx) => {
            const cell = document.querySelectorAll('.workspace-worker-cell')[idx];
            if (cell) {
              const statusEl = cell.querySelector('.w-status');
              if (statusEl) {
                statusEl.className = 'w-status ' + w.status;
                statusEl.textContent = w.status;
              }
            }
          });
        }
        // Refresh status badge — workers may have transitioned busy↔idle.
        updateStatusBadge();
        // Refresh status bar Workers count
        const sbWorkers = document.querySelector('.statusbar [data-sb="workers"]');
        if (sbWorkers) {
          const busy = (APP.workers || []).filter(w => w.status === 'working').length;
          sbWorkers.textContent = `Workers: ${busy}/${APP.workerCount}`;
        }
      } catch (e) {}
    }, 1500);
  }
}

// --- Leader Chat (headless run mode) ---
const SLASH_COMMANDS = {
  '/model': { args: ['models'], desc: 'List available models' },
  '/help': { args: ['--help'], desc: 'Show OpenCode help' },
  '/version': { args: ['--version'], desc: 'Show version' },
  '/stats': { args: ['stats'], desc: 'Show token usage stats' },
  '/session': { args: ['session', 'list'], desc: 'List sessions' },
  '/providers': { args: ['providers'], desc: 'List providers' },
  '/agents': { args: ['agent', 'list'], desc: 'List agents' },
};

async function handleLeaderChat() {
  const input = document.getElementById('leader-input');
  if (!input || !input.value.trim()) return;
  const text = input.value.trim();
  input.value = '';

  appendSystemLog('info', 'leader-chat', `User sent: "${text.slice(0, 100)}"`);
  APP.leaderMessages.push({ role: 'user', content: text });
  updateLeaderChatUI();

  // Check for slash commands
  const firstWord = text.split(' ')[0].toLowerCase();
  if (SLASH_COMMANDS[firstWord]) {
    const cmd = SLASH_COMMANDS[firstWord];
    appendSystemLog('info', 'slash-cmd', `Running: opencode ${cmd.args.join(' ')}`);
    APP.leaderMessages.push({ role: 'system', content: `Running: opencode ${cmd.args.join(' ')}...` });
    updateLeaderChatUI();
    try {
      const result = await invoke('run_opencode_command', { args: cmd.args });
      appendSystemLog('ok', 'slash-cmd', `Result: ${result.slice(0, 200)}`);
      APP.leaderMessages.push({ role: 'assistant', content: result || '(no output)' });
    } catch (e) {
      appendSystemLog('error', 'slash-cmd', `Error: ${e}`);
      APP.leaderMessages.push({ role: 'system', content: `Error: ${e}` });
    }
    updateLeaderChatUI();
    return;
  }

  // Regular message → send to Leader via opencode run
  APP.leaderMessages.push({ role: 'system', content: '⏳ Thinking...' });
  updateLeaderChatUI();
  appendSystemLog('info', 'leader-chat', 'Sending to opencode run (headless)...');

  try {
    await invoke('send_to_leader', { message: text });
    appendSystemLog('ok', 'leader-chat', 'Message sent to backend successfully');
    // Response comes via leader-output event
  } catch (e) {
    appendSystemLog('error', 'leader-chat', `send_to_leader failed: ${e}`);
    APP.leaderMessages = APP.leaderMessages.filter(m => m.content !== '⏳ Thinking...');
    APP.leaderMessages.push({ role: 'system', content: `Error: ${e}` });
    updateLeaderChatUI();
  }
}

function updateLeaderChatUI() {
  const area = document.getElementById('leader-chat-area');
  if (!area) return;
  area.innerHTML = APP.leaderMessages.map(m => {
    if (m.role === 'user') return `<div class="chat-msg user">${escapeHtml(m.content)}</div>`;
    if (m.role === 'system') return `<div class="chat-msg system">${escapeHtml(m.content)}</div>`;
    return `<div class="chat-msg assistant"><pre style="white-space:pre-wrap;margin:0;font-family:inherit;line-height:1.5">${escapeHtml(m.content)}</pre></div>`;
  }).join('');
  area.scrollTop = area.scrollHeight;
}

function appendSystemLog(level, source, message) {
  if (!APP.systemLogs) APP.systemLogs = [];
  const ts = new Date().toLocaleTimeString([], { hour12: false }) + '.' + String(new Date().getMilliseconds()).padStart(3, '0');
  APP.systemLogs.push({ ts, level: level || 'info', source: source || 'ui', message: message || '' });
  // Keep buffer manageable
  if (APP.systemLogs.length > 1000) APP.systemLogs.splice(0, APP.systemLogs.length - 1000);

  // Append to DOM if panel visible
  const body = document.getElementById('log-panel-body');
  if (body) {
    const div = document.createElement('div');
    div.className = 'log-line';
    div.innerHTML = `
      <span class="log-ts">${escapeHtml(ts)}</span>
      <span class="log-level log-level-${level}">${escapeHtml((level||'info').toUpperCase())}</span>
      <span class="log-source">[${escapeHtml(source||'ui')}]</span>
      <span class="log-msg">${escapeHtml(message||'')}</span>
    `;
    body.appendChild(div);
    body.scrollTop = body.scrollHeight;
    // Update count
    const count = document.querySelector('.log-panel-header .log-count');
    if (count) count.textContent = APP.systemLogs.length;
    const sbCount = document.querySelector('.statusbar span[onclick="toggleLogPanel()"]');
    if (sbCount) sbCount.textContent = `📋 Logs (${APP.systemLogs.length})`;
  }
  console.log(`[${ts}] [${level}] [${source}] ${message}`);
}

// Compute the friendly status label for the workspace badge.
function describeLeaderStatus() {
  const busy = APP.leaderBusy;
  const turns = APP.leaderTurnCount || 0;
  const workersBusy = (APP.workers || []).filter(w => w.status === 'working').length;
  const workersTotal = APP.workerCount || 6;
  if (workersBusy > 0) {
    return { label: `🔵 Workers ${workersBusy}/${workersTotal}`, cls: 'busy', tip: 'Workers are executing tasks' };
  }
  if (busy) {
    return { label: '🟡 Leader thinking...', cls: 'busy', tip: 'Leader is generating a response' };
  }
  if (turns === 0) {
    return { label: '⏳ Briefing...', cls: 'briefing', tip: 'Sending briefing to Leader' };
  }
  return { label: '🟢 Idle', cls: 'idle', tip: 'Ready for input' };
}

// Pull the current `git diff --stat` output from the backend and re-render
// only the changelog node (so we don't disturb the chat scroll).
async function refreshChangelog() {
  try {
    const ch = await invoke('get_git_changes', {});
    APP.gitChanges = ch;
    const node = document.getElementById('ws-changelog');
    if (node) {
      const wrapper = document.createElement('div');
      wrapper.innerHTML = renderChangelogPanel();
      const fresh = wrapper.firstElementChild;
      if (fresh) node.replaceWith(fresh);
    }
  } catch (e) {
    appendSystemLog('debug', 'changelog', `refresh failed: ${e}`);
  }
}

// Show a 5-second countdown banner that auto-triggers delegation. The user
// can click [Cancel] to stop.
function startAutoDelegateCountdown() {
  if (APP.autoDelegateTimer) return; // already running
  if (!APP.detectedPlan || !APP.detectedPlan.tasks.length) return;

  const planKey = APP.detectedPlan.tasks.map(t => t.num + ':' + t.desc.slice(0, 20)).join('|');
  if (APP.lastDelegatedPlanKey === planKey) return;

  APP.autoDelegateRemaining = 5;
  const bar = document.getElementById('auto-delegate-bar');
  if (!bar) return;

  const renderBar = () => {
    bar.style.display = 'flex';
    bar.style.cssText = 'display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(166,227,161,0.12);border-top:1px solid var(--green);font-size:12px;color:var(--text)';
    bar.innerHTML = `
      <span>⏱ Auto-delegate dalam <b id="auto-delegate-secs">${APP.autoDelegateRemaining}</b>s...</span>
      <span style="flex:1"></span>
      <button id="btn-auto-delegate-now" style="background:var(--green);color:var(--bg-crust);border:none;border-radius:4px;padding:4px 10px;font-weight:600;cursor:pointer">Delegate now</button>
      <button id="btn-auto-delegate-cancel" style="background:var(--border);color:var(--text);border:none;border-radius:4px;padding:4px 10px;cursor:pointer">Cancel</button>
    `;
    document.getElementById('btn-auto-delegate-now')?.addEventListener('click', () => {
      cancelAutoDelegate();
      delegateTasksToWorkers();
    });
    document.getElementById('btn-auto-delegate-cancel')?.addEventListener('click', cancelAutoDelegate);
  };
  renderBar();

  APP.autoDelegateTimer = setInterval(() => {
    APP.autoDelegateRemaining -= 1;
    const secs = document.getElementById('auto-delegate-secs');
    if (secs) secs.textContent = APP.autoDelegateRemaining;
    if (APP.autoDelegateRemaining <= 0) {
      cancelAutoDelegate();
      APP.lastDelegatedPlanKey = planKey;
      delegateTasksToWorkers();
    }
  }, 1000);
}

function cancelAutoDelegate() {
  if (APP.autoDelegateTimer) {
    clearInterval(APP.autoDelegateTimer);
    APP.autoDelegateTimer = null;
  }
  const bar = document.getElementById('auto-delegate-bar');
  if (bar) {
    bar.style.display = 'none';
    bar.innerHTML = '';
  }
}

function shortenProxy(addr) {
  // socks5://user:pass@host:port -> host:port
  try {
    const m = addr.match(/(?:^[a-z]+:\/\/)?(?:[^@\/]+@)?([^\/]+)/);
    return m ? m[1] : addr;
  } catch (e) { return addr; }
}

// --- Leader plan detection ---
function detectLeaderPlan() {
  if (!APP.leaderRawBuffer) return;
  // Look at last 10KB for numbered task list
  const tail = APP.leaderRawBuffer.slice(-10000);
  const lines = tail.split('\n');

  const tasks = [];
  for (const line of lines) {
    // Match: "1. Description — Files: path1.ext, path2.ext (depends on task N)"
    const m = line.match(/^\s*(\d+)[.)]\s+(.+?)(?:\s*[—-]\s*Files?:\s*([^()]+?))?(?:\s*\(depends?\s+on\s+(?:task\s+)?(\d+(?:\s*,\s*\d+)*)\))?\s*$/i);
    if (!m) continue;
    const num = parseInt(m[1], 10);
    const desc = m[2].trim();
    const files = m[3] ? m[3].split(',').map(f => f.trim()).filter(Boolean) : [];
    const deps = m[4] ? m[4].split(',').map(s => parseInt(s.trim(), 10)).filter(n => !isNaN(n)) : [];

    // Skip lines that look like list-of-something but not actual tasks
    if (desc.length < 10) continue;

    tasks.push({ num, desc, files, deps });
  }

  if (tasks.length < 2) {
    return;
  }

  // De-dupe by ordinal
  const unique = new Map();
  tasks.forEach(t => unique.set(t.num, t));
  const finalTasks = Array.from(unique.values()).sort((a, b) => a.num - b.num);

  // Only update if changed
  const newPlan = { tasks: finalTasks, raw: tail };
  if (!APP.detectedPlan || APP.detectedPlan.tasks.length !== finalTasks.length) {
    APP.detectedPlan = newPlan;
    appendSystemLog('info', 'plan-detect', `Detected plan with ${finalTasks.length} tasks!`);
    finalTasks.forEach(t => appendSystemLog('debug', 'plan-detect', `  Task ${t.num}: ${t.desc.slice(0, 80)}`));
    // Update header without full re-render to avoid disturbing xterm
    const header = document.querySelector('.workspace-leader-header');
    if (header) {
      let btn = document.getElementById('btn-ws-delegate');
      if (!btn) {
        btn = document.createElement('button');
        btn.id = 'btn-ws-delegate';
        btn.style.cssText = 'background:var(--green);color:var(--bg-crust);font-weight:600';
        btn.title = 'Delegate detected tasks to parallel Workers';
        const restart = document.getElementById('btn-ws-restart');
        if (restart) header.insertBefore(btn, restart);
        else header.appendChild(btn);
        btn.addEventListener('click', delegateTasksToWorkers);
      }
      btn.textContent = `▶ Delegate ${finalTasks.length} tasks to Workers`;
    }

    // Kick off the 5s auto-delegate countdown (user can cancel).
    startAutoDelegateCountdown();
  }
}

async function delegateTasksToWorkers() {
  if (!APP.detectedPlan || !APP.detectedPlan.tasks.length) return;
  cancelAutoDelegate();
  const planKey = APP.detectedPlan.tasks.map(t => t.num + ':' + t.desc.slice(0, 20)).join('|');
  APP.lastDelegatedPlanKey = planKey;
  appendSystemLog('info', 'frontend', `Delegate: ${APP.detectedPlan.tasks.length} tasks detected`);

  const btn = document.getElementById('btn-ws-delegate');
  if (btn) { btn.disabled = true; btn.textContent = 'Spawning workers...'; }

  try {
    // Build plan text in the format approve_plan expects
    const planText = APP.detectedPlan.tasks.map(t => {
      let line = `${t.num}. ${t.desc}`;
      if (t.files.length) line += ` — Files: ${t.files.join(', ')}`;
      if (t.deps.length) line += ` (depends on task ${t.deps.join(', ')})`;
      return line;
    }).join('\n');

    appendSystemLog('debug', 'frontend', `Sending plan to backend (${planText.length} chars)`);
    const ids = await invoke('approve_plan', {
      sessionId: APP.sessionId,
      planText,
    });
    appendSystemLog('info', 'frontend', `✓ Backend returned ${ids.length} task IDs: ${JSON.stringify(ids)}`);

    if (btn) btn.textContent = `✓ ${ids.length} workers spawned`;

    APP.detectedPlan.tasks.forEach((t, i) => {
      const entry = APP.terminals.get(i);
      if (entry) {
        entry.term.writeln(`\x1b[36m▶ Task: ${t.desc.slice(0, 60)}\x1b[0m`);
        if (t.files.length) entry.term.writeln(`\x1b[2m  Files: ${t.files.join(', ')}\x1b[0m`);
      }
    });

    APP.detectedPlan = null;
    setTimeout(() => {
      const b = document.getElementById('btn-ws-delegate');
      if (b) b.remove();
    }, 2500);
  } catch (e) {
    appendSystemLog('error', 'frontend', `Delegate failed: ${e}`);
    if (btn) btn.textContent = `✗ ${e}`;
    showError('Delegate failed: ' + e);
  }
}

async function fetchAllIps() {
  // Leader IP
  try {
    const info = await invoke('get_leader_info', {});
    APP.leaderProxy = info.proxy_addr || null;
    const leaderIp = await invoke('get_public_ip', { proxyAddr: info.proxy_addr || null });
    APP.leaderIp = leaderIp;
    // Update header IP without full re-render
    const headerIp = document.querySelector('.workspace-leader-header span[title*="IP via proxy"]');
    if (headerIp) headerIp.textContent = 'IP: ' + leaderIp;
  } catch (e) {
    APP.leaderIp = 'unavailable';
  }

  // Workers IPs
  try {
    const workers = await invoke('get_workers_proxy_info', {});
    APP.workerIps = APP.workerIps || [];
    // Fetch in parallel
    const promises = workers.map(async (w, idx) => {
      try {
        const ip = await invoke('get_public_ip', { proxyAddr: w.proxy_addr || null });
        APP.workerIps[idx] = ip;
        // Live update the worker proxy span
        const cells = document.querySelectorAll('.workspace-worker-cell');
        if (cells[idx]) {
          const proxyEl = cells[idx].querySelector('.w-proxy');
          if (proxyEl) proxyEl.textContent = ip;
        }
      } catch (e) {
        APP.workerIps[idx] = 'no-proxy';
      }
    });
    await Promise.all(promises);
  } catch (e) {
    console.warn('Could not fetch worker IPs:', e);
  }
}

function renderComplete() {
  const elapsed = APP.startTime ? formatElapsed(Date.now() - APP.startTime) : '0:00';
  const doneCount = APP.execTasks.filter(t => t.status === 'done').length;
  const failedCount = APP.execTasks.filter(t => t.status === 'error').length;
  return `
    <div class="complete-icon">&#10004;</div>
    <div class="complete-title">Session Complete</div>
    <div class="complete-stats">
      <div class="stat-item"><div class="stat-value">${doneCount}</div><div class="stat-label">Tasks Completed</div></div>
      <div class="stat-item"><div class="stat-value">${elapsed}</div><div class="stat-label">Time Elapsed</div></div>
      <div class="stat-item"><div class="stat-value">${failedCount}</div><div class="stat-label">Failures</div></div>
    </div>
    <button class="btn-primary" id="btn-new-session" style="margin-top:24px">New Session</button>
  `;
}

async function handleOpenFolder() {

    const result = await openFolderDialog();

function handleFolderGo() {
  const input = document.getElementById('folder-path-input');
  if (input && input.value.trim()) {
    APP.projectDir = input.value.trim();
    invoke('add_recent_project', { path: APP.projectDir }).catch(() => {});
    loadAdaptersAndGo();
  }
}

async function loadAdaptersAndGo() {
  // Reset loading state
  APP.loadingLog = [];
  APP.loadingStatus = 'Preparing workspace...';
  APP.loadingDetail = '';

  goTo('loading');

  // Step 1: Validate folder
  setLoadingStatus('Validating project folder...', APP.projectDir);
  appendLoadingLog('info', '> Selected: ' + APP.projectDir);
  try {
    await invoke('select_folder', { path: APP.projectDir });
    appendLoadingLog('ok', '✓ Folder validated');
  } catch (e) {
    appendLoadingLog('err', '✗ ' + e);
    showError('select_folder: ' + e);
    return;
  }

  // Step 2: Launch OpenCode
  setLoadingStatus('Launching OpenCode TUI...', 'Spawning PTY process + sending Leader briefing');
  appendLoadingLog('info', '> Initializing Leader adapter');
  APP.selectedAdapter = { id: 'opencode', type: 'cli', desc: 'Bundled OpenCode CLI' };
  APP.connectionStatus = 'connecting';

  try {
    const sid = await invoke('choose_leader', { adapterId: 'opencode', projectDir: APP.projectDir });
    if (typeof sid === 'string') APP.sessionId = sid;
    APP.connectionStatus = 'connected';
    appendLoadingLog('ok', '✓ OpenCode connected (session: ' + (APP.sessionId || 'n/a') + ')');
  } catch (e) {
    appendLoadingLog('err', '✗ Failed to launch OpenCode: ' + e);
    showError('Failed to launch OpenCode: ' + e);
    return;
  }

  // Wait for OpenCode to process the system prompt (Leader briefing)
  setLoadingStatus('Briefing Leader AI...', 'System prompt being processed');
  appendLoadingLog('info', '> Leader receiving role briefing (system prompt)');
  await new Promise(r => setTimeout(r, 2000));
  appendLoadingLog('ok', '✓ Leader briefed and ready');

  setLoadingStatus('Ready! Opening workspace...', '');
  await new Promise(r => setTimeout(r, 400));

  goTo('workspace');
}

async function handleAdapterSelect(adapterId) {
  const adapter = APP.adapters.find(a => a.id === adapterId);
  if (!adapter) return;
  APP.selectedAdapter = adapter;
  APP.connectionStatus = 'connecting';
  APP.connectionMessage = 'Launching ' + adapterId + '...';
  APP.connectionLog = [{ ts: new Date().toLocaleTimeString(), status: 'connecting', message: 'Initiating connection to ' + adapterId }];
  render();

  try {
    const result = await invoke('choose_leader', { adapterId: adapterId, projectDir: APP.projectDir });
    // Backend returns session_id string directly
    if (typeof result === 'string') APP.sessionId = result;
    // If no event came from backend, set connected
    if (APP.connectionStatus === 'connecting') {
      APP.connectionStatus = 'connected';
      APP.connectionMessage = 'Connected to ' + adapterId;
      APP.connectionType = (adapter.type || adapter.adapter_type) === 'cli' ? 'CLI process via PTY (pseudo-terminal)' : (adapter.type || adapter.adapter_type) === 'gui' ? 'GUI window embedded via Win32 SetParent + UI Automation' : 'HTTP API';
      APP.connectionLog.push({ ts: new Date().toLocaleTimeString(), status: 'connected', message: 'Successfully connected to ' + adapterId });
    }
  } catch (e) {
    APP.connectionStatus = 'failed';
    APP.connectionMessage = 'Failed to connect: ' + e;
    APP.connectionLog.push({ ts: new Date().toLocaleTimeString(), status: 'failed', message: 'Connection failed: ' + e });
    showError(`Failed to connect to ${adapterId}: ${e}`);
    render();
    return;
  }

  APP.messages = [{ role: 'system', content: `Leader connected: ${adapter.id} (${adapter.type || adapter.adapter_type}). Describe what you want to build.` }];
  APP.leaderMessages = [];
  goTo('planning');
}

async function handleChatSend() {
  const input = document.getElementById('chat-input');
  if (!input || !input.value.trim()) return;
  const text = input.value.trim();
  input.value = '';

  APP.messages.push({ role: 'user', content: text });

  // Auto-detect numbered plan
  const lines = text.split('\n');
  const numbered = lines.map(l => l.match(/^\s*(\d+)[.)]\s+(.+)$/)).filter(Boolean);
  if (numbered.length >= 1) {
    APP.planText = text;
    APP.planTasks = numbered.map(m => m[2]);
  }

  // Add typing indicator
  APP.messages.push({ role: 'assistant', content: '', typing: true });
  updatePlanningChat();

  try {
    await invoke('send_to_leader', { message: text });
  } catch (e) {
    APP.messages = APP.messages.filter(m => !m.typing);
    APP.messages.push({ role: 'system', content: `Error: ${e}` });
    updatePlanningChat();
  }
}

function updatePlanningChat() {
  const chat = document.getElementById('leader-chat');
  if (!chat) return;
  chat.innerHTML = APP.messages.map(m => {
    const cls = m.role === 'user' ? 'chat-msg user'
              : m.role === 'system' ? 'chat-msg system'
              : 'chat-msg assistant';
    const content = m.typing ? '<span style="opacity:.6">▌ thinking...</span>' : escapeHtml(m.content);
    return `<div class="${cls}">${content}</div>`;
  }).join('');
  chat.scrollTop = chat.scrollHeight;
}

async function handleExecuteDirect() {
  // Take the last user message and execute it directly as a task
  const lastUserMsg = [...APP.messages].reverse().find(m => m.role === 'user');
  if (!lastUserMsg) {
    showError('No message to execute. Type something first.');
    return;
  }

  const text = lastUserMsg.content;
  const lines = text.split('\n');
  const numbered = lines.map(l => l.match(/^\s*(\d+)[.)]\s+(.+)$/)).filter(Boolean);

  if (numbered.length >= 1) {
    // Use numbered list as plan
    APP.planText = text;
    APP.planTasks = numbered.map(m => m[2]);
  } else {
    // Single task
    APP.planText = '1. ' + text;
    APP.planTasks = [text];
  }

  await handleApprovePlan();
}

async function handleApprovePlan() {
  APP.execTasks = APP.planTasks.map((t, i) => ({ id: 'task_' + i, title: t, status: 'pending', worker_id: null }));
  APP.startTime = Date.now();
  APP.leaderMessages.push({ role: 'system', content: 'Plan approved. Distributing tasks to Workers...' });
  APP.logs = [];
  // Initialize workers array with idle state
  APP.workers = Array.from({ length: APP.workerCount }, (_, i) => ({
    id: i, status: 'idle', proxy_addr: `socks5://proxy-${i+1}:1080`, current_task: null
  }));

  try {
    const result = await invoke('approve_plan', { sessionId: APP.sessionId, planText: APP.planText });
    if (result) APP.logs.push('Workers spawned: ' + (Array.isArray(result) ? result.length : 0) + ' tasks queued');
  } catch (e) {
    showError('approve_plan failed: ' + e);
    return;
  }

  goTo('executing');
}

function handleRevisePlan() {
  APP.messages.push({ role: 'user', content: 'I would like some changes to the plan. Please revise.' });
  APP.planText = '';
  APP.planTasks = [];
  goTo('planning');
}

function handleNewSession() {
  // Reset state
  APP.screen = 'welcome';
  APP.projectDir = null;
  APP.adapters = [];
  APP.selectedAdapter = null;
  APP.sessionId = null;
  APP.messages = [];
  APP.planText = '';
  APP.planTasks = [];
  APP.execTasks = [];
  APP.workers = [];
  APP.logs = [];
  APP.leaderMessages = [];
  APP.startTime = null;
  APP.showTerminal = false;
  APP.showProviderList = false;
  APP.connectionStatus = 'disconnected';
  APP.connectionLog = [];
  if (APP.integratedTerm) { APP.integratedTerm.dispose(); APP.integratedTerm = null; }
  disposeTerminals();
  if (APP.pollInterval) { clearInterval(APP.pollInterval); APP.pollInterval = null; }
  render();
}

async function handleLeaderSend() {
  const input = document.getElementById('leader-input');
  if (!input || !input.value.trim()) return;
  const text = input.value.trim();
  input.value = '';
  APP.leaderMessages.push({ role: 'user', content: text });

  // Auto-detect numbered plan in user's own message
  const lines = text.split('\n');
  const numbered = lines.map(l => l.match(/^\s*(\d+)[.)]\s+(.+)$/)).filter(Boolean);
  if (numbered.length >= 1) {
    APP.planText = text;
    APP.planTasks = numbered.map(m => m[2]);
    render();
    return;
  }

  updateLeaderChat();

  try {
    // OpenCode is a TUI — append \r to submit the message
    await invoke('send_to_leader', { message: text + '\r' });
  } catch (e) {
    APP.leaderMessages.push({ role: 'system', content: `Error: ${e}` });
    updateLeaderChat();
  }
}

function attachMenuEvents() {

  document.addEventListener('click', closeAllMenus);

  document.querySelectorAll('.menu-dropdown-item').forEach(item => {
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      const action = item.dataset.action;
      closeAllMenus();
      handleMenuAction(action);
    });

  if (btnMin) btnMin.addEventListener('click', async () => {
    const fn = await getTauriInvoke();
    if (fn) fn('minimize_window', {}).catch(()=>{});

  if (btnMax) btnMax.addEventListener('click', async () => {

    if (fn) fn('toggle_maximize_window', {}).catch(()=>{});
  });
  const btnClose = document.getElementById('btn-close');
  if (btnClose) btnClose.addEventListener('click', async () => {

  });
