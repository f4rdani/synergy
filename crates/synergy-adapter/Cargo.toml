[package]
name = "synergy-adapter"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
once_cell = "1.19"
strip-ansi-escapes = "0.2"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
synergy-pty = { path = "../synergy-pty" }
synergy-win32 = { path = "../synergy-win32" }
